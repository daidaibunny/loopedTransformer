[project]
name = "looped-vl"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
	"orjson>=3.10",
	"pillow>=10.2",
	"pyarrow>=23.0",
	"qwen-vl-utils>=0.0.14",
	"torch>=2.8",
	"transformers>=4.57",
]

[dependency-groups]
dev = [
	"pytest>=8.3",
	"ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
